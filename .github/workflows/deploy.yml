name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # `node --test tests/` takes a folder on this version
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write what is being published
        run: |
          cat > version.js <<EOF
          export const VERSION = { sha: '$GITHUB_SHA', deployedAt: '$(date -u +%FT%TZ)' };
          EOF
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: pages
        uses: actions/deploy-pages@v5
